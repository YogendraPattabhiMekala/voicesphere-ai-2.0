services:
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/voicesphere.db
      CORS_ORIGINS: http://localhost:3001
    volumes: [voicesphere-data:/data]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3001:3000"]
    depends_on: [api]
volumes:
  voicesphere-data:
